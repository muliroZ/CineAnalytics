[project]
name = "cineanalytics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "muliroZ", email = "murilomega100@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai-slim[openai]>=2.9.0",
    "pydantic-settings",
    "rich>=14.1.0",
    "typer>=0.27.2",
    "markdown-it-py",
    "sqlglot>=30.21.0",
    "jinja2",
    "pyyaml"
]

[project.scripts]
cineanalytics = "cineanalytics.cli:app"
 
[dependency-groups]
dev = ["pytest"]
 
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
 
[tool.hatch.build.targets.wheel]
packages = ["src/cineanalytics"]
 
[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
filterwarnings = ["ignore:There is no current event loop:DeprecationWarning:pydantic_graph"]
